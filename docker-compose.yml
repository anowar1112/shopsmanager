services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_dev_password
      POSTGRES_DB: shop_manager
    ports:
      - "5432:5432"
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop_pgdata:
